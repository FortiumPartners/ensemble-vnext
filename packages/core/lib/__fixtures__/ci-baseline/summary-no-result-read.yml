name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          token: ''
          base: ${{ github.event.before }}
          filters: |
            code:
              - 'src/**'
  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: npm test
  ci-summary:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo done
