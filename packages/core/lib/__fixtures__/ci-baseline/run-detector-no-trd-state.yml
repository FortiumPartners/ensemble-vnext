name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          files=$(git diff --name-only ${{ github.event.before }} HEAD)
          echo "$files" | grep -q . && echo "code=true" >> $GITHUB_OUTPUT
  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: npm test
  ci-summary:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" != "failure"
