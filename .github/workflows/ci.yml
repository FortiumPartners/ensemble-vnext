name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-sync:
    name: Version manifest sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check version manifests agree
        run: ./packages/core/scripts/check-version-sync.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Scoped to framework scripts. packages/core/hooks and
          # packages/skills/*/tests carry pre-existing warnings; widen this
          # glob as those are cleaned up rather than blocking on them now.
          # SC1091: sourced files aren't resolvable in isolation
          # SC2317: BATS test bodies read as unreachable to shellcheck
          find packages/core/scripts -name '*.sh' -not -name '*.test.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --exclude=SC1091,SC2317

  jest:
    name: Jest (hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm ci` failing is a signal (lockfile drifted from package.json, or a
      # dependency vanished from the registry) — `|| npm install` used to
      # swallow that signal and install possibly-different versions than the
      # lockfile pins, so a broken lockfile would pass CI silently. `npm ci`
      # was verified clean against this lockfile on 2026-09-25; no fallback.
      - run: npm ci
      # No suite is currently excluded from CI as "known-failing". The three
      # that were (status.test.js, judge.test.js, run-eval.test.js) all
      # actually passed — 67, 60 and 42 tests respectively — verified
      # 2026-09-25 both locally and under `env -i` (no inherited env, no
      # fixtures tree, no network). 169 tests were invisible to CI for no
      # reason. If a suite genuinely needs to be skipped outright as
      # known-failing in the future, exclude it below AND mark it with a
      # "KNOWN-FAILING" comment naming its path so
      # check-jest-known-failing.sh can catch it going stale the same way
      # this one did — see that script for the exact marker format and the
      # mechanism.
      - name: Run Jest
        # --runInBand: the parallel worker pool does not tear down on one of
        # these suites, so `npx jest` passed in ~2s and then hung until the
        # runner's 6-hour limit — the "Jest (hooks)" check sat in_progress
        # forever and never reported. Serial execution exits cleanly and the
        # whole suite takes ~1s, so there is nothing to win from workers here.
        #
        # status.test.js needed its own isolated step until 2026-09-25: the hook
        # it tests registered real process.stdin listeners at module load with no
        # `require.main === module` guard, and its 'end' handler could fire
        # mid-run and call the hook's real process.exit(0) — killing Jest after
        # 15 of 33 files with exit code 0 and no summary. The guard is now in
        # status.js, so the suite runs with everything else and a combined run
        # completes. Do not re-split this step without re-measuring.
        #
        # NO --testPathIgnorePatterns HERE. That flag REPLACES the config value
        # rather than adding to it, so an inline list silently overrode
        # package.json's — which is why excluding test/evals/ there had no effect
        # on CI at all. Run 36207422111 hit the 10-minute timeout with
        # parse-hook-events.test.js and score.test.js both logged as PASS, two
        # suites that were already excluded locally. package.json's jest config is
        # the single source of truth; this step must not shadow it.
        # --verbose + the printed order are instrumentation, not preference. The job
        # hangs MID-RUN on CI: run 36208255023 logged 14 of 28 suites, no `Tests:`
        # summary, and 14 suites never started. Every one of those 14 passes and
        # exits cleanly when run alone locally, and the whole suite finishes in 4.5s
        # here with stdin closed and CI=true -- so the blocking suite cannot be
        # identified from this side. Printing the resolution order names the 15th,
        # and --verbose names the test inside it. Remove both once it is found.
        # jest.config.ci.js EXTENDS package.json's jest block and excludes one suite,
        # packages/core/lib/discovered.test.js, which hangs on the runner and nowhere
        # else. That file carries the full evidence and what was eliminated.
        #
        # Do NOT pass --testPathIgnorePatterns here. The flag REPLACES the config value
        # instead of extending it, so an inline list silently overrode package.json's
        # for three runs and every exclusion added there did nothing on CI.
        run: npx jest --runInBand --config jest.config.ci.js
      - name: Check no stale "known-failing" Jest exclusions
        run: ./packages/core/scripts/check-jest-known-failing.sh

  bats:
    name: BATS (shell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install BATS
        run: npm install -g bats
      - name: Run every shell suite
        env:
          # Headless suites shell out to the `claude` CLI and need the external
          # ensemble-vnext-test-fixtures/fixtures/ tree; neither exists on a
          # runner. Both suites now DEFAULT to skipping, so this is belt-and-
          # braces rather than load-bearing.
          SKIP_HEADLESS: 'true'
        # check-test-suites.sh replaced a hand-maintained find + grep-exclusion
        # list here on 2026-08-22. The list had gone stale in both directions:
        # it excluded validate-init.test.sh and commands.test.sh as "known
        # failing" when both pass, and it never ran test/evals/** or
        # test/integration/hooks/** at all — five suites, 146 assertions,
        # invisible to CI including the one whose script silently collected zero
        # files on macOS.
        #
        # More importantly the checker fails on the three ways a suite can look
        # healthy while running NOTHING: a gather failure (a @test header
        # deleted, its body left as top-level code), a file defining no tests,
        # and a setup_file abort ("Executed 1 instead of expected 22 tests").
        # All three occurred in this repo, and counting ok/not-ok sees none of
        # them. A green tick from `bats <files>` was not evidence the tests ran.
        run: ./packages/core/scripts/check-test-suites.sh

  structure:
    name: Structure and generated-artifact drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Command and rule files are edited by string replacement and reviewed by
      # grep, which cannot see structure. Caught in one session: a block
      # inserted ABOVE the YAML frontmatter, numbered lists broken into 1,3,4,5,
      # and table rows stranded after a paragraph where they render as prose.
      - name: Lint command/rule structure
        run: |
          node packages/core/scripts/lint-command-structure.js \
            packages/core/commands/*.md \
            packages/core/contracts/*.md \
            .claude/rules/*.md \
            packages/core/templates/claude-directory/rules/*.md
      # settings.json is GENERATED from hooks.manifest.json + the prompt files.
      # 4.1.18 regenerated a judge prompt, tested the prompt FILE, and shipped —
      # while every live settings.json kept the old text, so the fix was not in
      # force anywhere for two releases. This is the check that catches that.
      - name: Check generated hook artifacts are current
        run: ./packages/core/scripts/generate-hooks-artifacts.sh --check
