name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-sync:
    name: Version manifest sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version manifests agree
        run: ./packages/core/scripts/check-version-sync.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Scoped to framework scripts. packages/core/hooks and
          # packages/skills/*/tests carry pre-existing warnings; widen this
          # glob as those are cleaned up rather than blocking on them now.
          # SC1091: sourced files aren't resolvable in isolation
          # SC2317: BATS test bodies read as unreachable to shellcheck
          find packages/core/scripts -name '*.sh' -not -name '*.test.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --exclude=SC1091,SC2317

  jest:
    name: Jest (hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      # Scoped to suites that pass today so this gate is meaningful rather than
      # permanently red. `npm test` locally still runs everything and shows the
      # real state. Known-failing suites, all predating this workflow:
      #   packages/core/hooks/save-remote-logs.test.js
      #   packages/core/hooks/status.test.js
      #   packages/core/hooks/wiggum.test.js
      #   packages/permitter/tests/performance.test.js
      #   test/evals/framework/judge.test.js
      #   test/evals/framework/run-eval.test.js
      # Delete entries from this list as they are fixed.
      - name: Run Jest
        run: |
          npx jest \
            --testPathIgnorePatterns \
              '/node_modules/' \
              '<rootDir>/test/evals/analysis-archive/' \
              '<rootDir>/test/evals/results/' \
              '<rootDir>/packages/core/hooks/save-remote-logs.test.js' \
              '<rootDir>/packages/core/hooks/status.test.js' \
              '<rootDir>/packages/core/hooks/wiggum.test.js' \
              '<rootDir>/packages/permitter/tests/performance.test.js' \
              '<rootDir>/test/evals/framework/judge.test.js' \
              '<rootDir>/test/evals/framework/run-eval.test.js'

  bats:
    name: BATS (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install BATS
        run: npm install -g bats
      - name: Run shell test suites
        env:
          # Headless suites shell out to the `claude` CLI and need the external
          # ensemble-vnext-test-fixtures/fixtures/ tree; neither exists on a CI
          # runner. commands.test.sh defaults SKIP_HEADLESS to false, so it must
          # be set explicitly or setup_file aborts the whole suite.
          SKIP_HEADLESS: 'true'
        run: |
          # `find -prune` rather than packages/**: packages/full/scripts is a
          # symlink to packages/core/scripts, and following it runs the same
          # suites twice.
          #
          # Scoped to suites that pass today so this gate is meaningful rather
          # than permanently red. Known-failing suites, all predating this
          # workflow (run them locally to see the real state):
          #   packages/core/hooks/learning.test.sh      (20 failing)
          #   packages/core/scripts/validate-init.test.sh (3 failing)
          #   test/integration/tests/commands.test.sh    (1 failing —
          #     asserts a verify_router_rules helper that exists nowhere)
          # Delete entries from this list as they are fixed.
          mapfile -t files < <(
            {
              find packages -path packages/full -prune -o -name '*.test.sh' -print
              find test/integration/tests -maxdepth 1 -name '*.test.sh' -print
            } | grep -v -E '(learning|validate-init|commands)\.test\.sh$'
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No BATS suites found"; exit 0
          fi
          printf 'Running %d suites:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          bats "${files[@]}"
