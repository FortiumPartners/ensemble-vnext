<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:960px;height:300px;position:relative;background:var(--white);font-family:var(--font-sans, ui-sans-serif, system-ui, sans-serif);overflow:hidden}
  .name{position:absolute;left:32px;bottom:64px;margin:0;font-size:96px;line-height:.95;font-weight:600;color:var(--ink)}
  .tag{position:absolute;left:32px;bottom:32px;margin:0;font-size:14px;line-height:20px;color:var(--ink);opacity:.75;max-width:420px}
  svg{position:absolute;left:480px;top:0}
  .brand{fill:var(--brand)} .ink{fill:var(--ink)} .tint{fill:var(--slate-200)} .soft{fill:var(--slate-100)}
  .tile{rx:var(--radius-lg)}
</style></head>
<body>
<!--
Blocks: brand 208x252 (full value, the one hue), ink 108x156, slate-200 108x84, all with radius-lg corners.
Arrangement: one tall brand slab, two satellites stacked beside it, then a column of pills.
Pattern: pills (radius-full halves), because the only distinctive shape in the code is the Chip pill; soft, large-radius system.
Steps: 4px grid (space-1..space-4 multiples); pill height 24 = half-radius 12.
-->
<h1 class="name">Fixture<br>Web</h1>
<p class="tag">One blue, one ink, three small parts.</p>
<svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
  <rect class="brand tile" x="16" y="24" width="208" height="252"/>
  <rect class="ink tile" x="236" y="24" width="108" height="156"/>
  <rect class="tint tile" x="236" y="192" width="108" height="84"/>
  <rect class="brand" x="356" y="24" width="108" height="24" rx="12"/>
  <rect class="soft" x="356" y="60" width="84" height="24" rx="12"/>
  <rect class="ink" x="356" y="96" width="108" height="24" rx="12"/>
  <rect class="tint" x="356" y="132" width="72" height="24" rx="12"/>
  <rect class="brand" x="356" y="168" width="96" height="24" rx="12"/>
  <rect class="soft" x="356" y="204" width="108" height="24" rx="12"/>
  <rect class="ink" x="356" y="240" width="60" height="24" rx="12"/>
</svg>
</body></html>
